  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..800;1,9..144,300..700&family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600&display=swap"
    rel="stylesheet">

  <script>
    window.addEventListener('error', function(e) {
      console.error('Captured window error:', e);
      var errBox = document.getElementById('debug-error');
      if (!errBox) {
        errBox = document.createElement('div');
        errBox.id = 'debug-error';
        errBox.style = 'position:fixed;top:0;left:0;width:100%;background:#E4442C;color:white;padding:24px;z-index:999999;font-family:monospace;white-space:pre-wrap;font-size:14px;';
        document.body.appendChild(errBox);
      }
      errBox.textContent += 'RUNTIME ERROR: ' + (e.error ? (e.error.stack || e.error.message) : e.message) + '\n';
    });
    window.addEventListener('unhandledrejection', function(e) {
      console.error('Captured unhandled rejection:', e);
      var errBox = document.getElementById('debug-error');
      if (!errBox) {
        errBox = document.createElement('div');
        errBox.id = 'debug-error';
        errBox.style = 'position:fixed;top:0;left:0;width:100%;background:#E4442C;color:white;padding:24px;z-index:999999;font-family:monospace;white-space:pre-wrap;font-size:14px;';
        document.body.appendChild(errBox);
      }
      errBox.textContent += 'UNHANDLED REJECTION: ' + (e.reason ? (e.reason.stack || e.reason.message) : e.reason) + '\n';
    });
  </script>
</head>
